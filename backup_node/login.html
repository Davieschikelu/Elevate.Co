<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Elevate</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 antialiased">
<div x-data="{ 
    isLogin: true, 
    isLoading: false, 
    email: '', 
    password: '',
    async handleLogin() {
        this.isLoading = true;
        try {
            const response = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: this.email, password: this.password })
            });
            const data = await response.json();
            if (data.success) {
                window.location.href = dashboardd.html;
            } else {
                alert(data.message || 'Login failed');
                this.isLoading = false;
            }
        } catch (e) {
            console.error(e);
            alert('An error occurred');
            this.isLoading = false;
        }
    }
}" class="min-h-screen bg-slate-50 flex items-center justify-center p-4 md:p-10">
    
    <div class="bg-white w-full max-w-5xl min-h-[700px] rounded-[2.5rem] shadow-2xl shadow-indigo-100 flex overflow-hidden relative">
        
        <div class="hidden lg:flex w-1/2 bg-indigo-600 relative overflow-hidden p-12 flex-col justify-between">
            <div class="absolute top-0 right-0 -mr-16 -mt-16 w-64 h-64 bg-indigo-500 rounded-full mix-blend-multiply filter blur-3xl opacity-50 animate-pulse"></div>
            <div class="absolute bottom-0 left-0 -ml-16 -mb-16 w-80 h-80 bg-blue-400 rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-bounce" style="animation-duration: 10s;"></div>

            <div class="relative z-10">
                <div class="text-white font-black text-2xl italic tracking-tighter">ELEVATE</div>
            </div>

            <div class="relative z-10">
                <h2 class="text-4xl font-bold text-white leading-tight mb-4">
                    The fastest way to <br> <span class="text-indigo-200">the interview.</span>
                </h2>
                <p class="text-indigo-100 text-lg">Our AI handles the formatting and wording. You handle the handshake.</p>
            </div>

            <div class="relative z-10 bg-white/10 backdrop-blur-md border border-white/20 p-4 rounded-2xl transform rotate-3 hover:rotate-0 transition-transform duration-700">
                <div class="flex items-center gap-3 mb-3">
                    <div class="w-8 h-8 rounded-full bg-indigo-200/30"></div>
                    <div class="h-2 w-24 bg-indigo-200/30 rounded"></div>
                </div>
                <div class="space-y-2">
                    <div class="h-2 w-full bg-white/20 rounded"></div>
                    <div class="h-2 w-5/6 bg-white/20 rounded"></div>
                    <div class="h-2 w-4/6 bg-white/20 rounded"></div>
                </div>
            </div>
        </div>

        <div class="w-full lg:w-1/2 p-8 md:p-16 flex flex-col justify-center relative overflow-hidden">
            <a href="index.html" class="absolute top-6 right-6 flex items-center gap-2 text-slate-400 hover:text-indigo-600 transition-colors group">
                <span class="text-sm font-semibold group-hover:underline">Home</span>
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
                </svg>
            </a>
            
            <div x-show="isLogin" 
                 x-transition:enter="transition ease-out duration-500"
                 x-transition:enter-start="opacity-0 translate-x-12"
                 x-transition:enter-end="opacity-100 translate-x-0"
                 x-transition:leave="transition ease-in duration-300"
                 x-transition:leave-start="opacity-100 translate-x-0"
                 x-transition:leave-end="opacity-0 -translate-x-12"
                 class="w-full">
                
                <h3 class="text-3xl font-black text-slate-800 mb-2">Welcome back</h3>
                <p class="text-slate-500 mb-8">Enter your credentials to access your resumes.</p>

                <form @submit.prevent="handleLogin()" class="space-y-5">
                    <div>
                        <label class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-2">Email Address</label>
                        <input type="email" x-model="email" required class="w-full px-5 py-4 bg-slate-50 border border-slate-100 rounded-2xl focus:ring-2 focus:ring-indigo-500 focus:bg-white outline-none transition-all duration-300" placeholder="name@company.com">
                    </div>
                    <div>
                        <div class="flex justify-between mb-2">
                            <label class="block text-xs font-bold text-slate-400 uppercase tracking-widest">Password</label>
                            <a href="#" class="text-xs font-bold text-indigo-600 hover:text-indigo-700">Forgot?</a>
                        </div>
                        <input type="password" x-model="password" required class="w-full px-5 py-4 bg-slate-50 border border-slate-100 rounded-2xl focus:ring-2 focus:ring-indigo-500 focus:bg-white outline-none transition-all duration-300" placeholder="••••••••">
                    </div>

                    <button type="submit" class="w-full bg-slate-900 text-white py-4 rounded-2xl font-bold text-lg hover:bg-indigo-600 hover:shadow-xl hover:shadow-indigo-200 transition-all duration-300 flex items-center justify-center gap-3">
                        <template x-if="isLoading">
                            <svg class="animate-spin h-5 w-5 text-white" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                        </template>
                        <span x-text="isLoading ? 'Signing in...' : 'Sign In'"></span>
            </button>
        </form>

                <p class="text-center mt-8 text-slate-500">
                    Don't have an account? 
                    <button @click="isLogin = false" class="text-indigo-600 font-bold hover:underline">Create one</button>
                </p>
            </div>

            <div x-show="!isLogin" 
                 x-transition:enter="transition ease-out duration-500"
                 x-transition:enter-start="opacity-0 translate-x-12"
                 x-transition:enter-end="opacity-100 translate-x-0"
                 x-transition:leave="transition ease-in duration-300"
                 x-transition:leave-start="opacity-100 translate-x-0"
                 x-transition:leave-end="opacity-0 -translate-x-12"
                 class="w-full">
                
                <h3 class="text-3xl font-black text-slate-800 mb-2">Get Started</h3>
                <p class="text-slate-500 mb-8">Join 50,000+ pros building better resumes.</p>

                <form class="space-y-4">
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1">First Name</label>
                            <input type="text" class="w-full px-4 py-3 bg-slate-50 border border-slate-100 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1">Last Name</label>
                            <input type="text" class="w-full px-4 py-3 bg-slate-50 border border-slate-100 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none">
                        </div>
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1">Email</label>
                        <input type="email" class="w-full px-4 py-3 bg-slate-50 border border-slate-100 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1">Create Password</label>
                        <input type="password" class="w-full px-4 py-3 bg-slate-50 border border-slate-100 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>

                    <button class="w-full bg-indigo-600 text-white py-4 rounded-xl font-bold hover:bg-indigo-700 transition-all shadow-lg shadow-indigo-100">
                        Create Account
                    </button>
                </form>

                <p class="text-center mt-6 text-slate-500 text-sm">
                    Already a member? 
                    <button @click="isLogin = true" class="text-indigo-600 font-bold hover:underline">Log in</button>
        </p>
    </div>

        </div>
    </div>
</div>
<script src="java.js"></script>
</body>
</html>
