<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Elevate</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-50">
    <nav class="bg-white border-b border-slate-200 px-8 py-4 flex justify-between items-center">
        <div class="text-2xl font-bold tracking-tight text-indigo-600">ELEVATE.</div>
        <div class="flex items-center gap-4">
            <span class="text-slate-600 font-medium">Welcome User</span>
            <button onclick="logout()" class="text-sm text-red-600 font-semibold hover:bg-red-50 px-4 py-2 rounded-lg transition">Log Out</button>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto px-8 py-12">
        <h1 class="text-3xl font-bold text-slate-800 mb-8">My Resumes</h1>
        
        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
            <!-- Create New Resume Card -->
            <div class="bg-white border-2 border-dashed border-slate-300 rounded-xl p-8 flex flex-col items-center justify-center text-center hover:border-indigo-400 hover:bg-indigo-50/50 transition cursor-pointer group h-64">
                <div class="w-16 h-16 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center mb-4 group-hover:scale-110 transition">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                    </svg>
                </div>
                <h3 class="text-lg font-bold text-slate-700 group-hover:text-indigo-700">Create New Resume</h3>
                <p class="text-slate-500 text-sm mt-2">Start from scratch or use a template</p>
            </div>
        </div>
    </div>

    <script>
        async function logout() {
            try {
                const response = await fetch('/api/logout', { method: 'POST' });
                const data = await response.json();
                if (data.success) {
                    window.location.href = data.redirect;
                }
            } catch (error) {
                console.error('Logout failed', error);
            }
        }
    </script>
</body>
</html>
