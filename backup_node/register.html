<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Elevate</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 flex items-center justify-center h-screen">
    <div x-data="{
        name: '',
        email: '',
        password: '',
        isLoading: false,
        async handleRegister() {
            this.isLoading = true;
            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: this.name, email: this.email, password: this.password })
                });
                const data = await response.json();
                if (data.success) {
                    window.location.href = data.redirect;
                } else {
                    alert(data.message || 'Registration failed');
                    this.isLoading = false;
                }
            } catch (e) {
                console.error(e);
                alert('An error occurred');
                this.isLoading = false;
            }
        }
    }" class="bg-white p-8 rounded-xl shadow-xl w-full max-w-md border border-slate-100">
        <h2 class="text-3xl font-bold text-center text-slate-800 mb-8">Create Account</h2>
        <form @submit.prevent="handleRegister">
            <div class="mb-5">
                <label class="block text-slate-600 font-medium mb-2">Full Name</label>
                <input type="text" x-model="name" required class="w-full px-4 py-3 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition" placeholder="John Doe">
            </div>
            <div class="mb-5">
                <label class="block text-slate-600 font-medium mb-2">Email Address</label>
                <input type="email" x-model="email" required class="w-full px-4 py-3 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition" placeholder="you@example.com">
            </div>
            <div class="mb-6">
                <label class="block text-slate-600 font-medium mb-2">Password</label>
                <input type="password" x-model="password" required class="w-full px-4 py-3 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition" placeholder="••••••••">
            </div>
            <button type="submit" class="w-full bg-indigo-600 text-white font-bold py-3 rounded-lg hover:bg-indigo-700 transition shadow-lg shadow-indigo-200 flex justify-center items-center">
                <span x-show="!isLoading">Sign Up</span>
                <svg x-show="isLoading" class="animate-spin h-5 w-5 text-white" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
            </button>
        </form>
        <p class="text-center mt-6 text-slate-500">
            Already have an account? <a href="login.html" class="text-indigo-600 font-bold hover:underline">Log in</a>
        </p>
    </div>
</body>
</html>
